name: Images

# Builds the production images here instead of on the server: the server's network times out
# on PyPI and npm, while it pulls from ghcr.io quickly. Tagged with the commit, so
# deploy/release.sh deploys exactly the commit it checked.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: images-${{ github.sha }}

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        name: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/${{ matrix.name }}.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/amozeshyar-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/amozeshyar-${{ matrix.name }}:main
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
