# Host nginx site for one instructor site. Everything lives on one hostname, so the browser
# never needs CORS: /api and /static go to Django, the media bucket goes to MinIO (signed URLs
# are generated for this same host), and the rest is the Nuxt app.
# Replace SITE_HOST, then: certbot --nginx -d SITE_HOST
server {
    listen 80;
    server_name SITE_HOST;

    # Lesson videos are uploaded through the API.
    client_max_body_size 2g;

    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # S3 signatures cover the Host header, so it must reach MinIO unchanged.
    location /modaresyar-media/ {
        proxy_pass http://127.0.0.1:9200;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
