# Host nginx site for one instructor site. Everything lives on one hostname, so the browser
# never needs CORS: /api and /static go to Django, the media bucket goes to MinIO (signed URLs
# are generated for this same host), and the rest is the Nuxt app.
# Replace SITE_HOST, then: certbot --nginx -d SITE_HOST -d www.SITE_HOST
# After certbot, add `http2 on;` under each `listen 443 ssl;` it wrote (13 Nuxt chunks load over
# one connection instead of several TLS handshakes).
#
# Django admin (/admin/) is deliberately not routed: reach it over an SSH tunnel to 127.0.0.1:8100.

# Defence in depth for login/register/OTP on top of DRF's "auth" throttle. Zone names are global
# to nginx, so they carry the project prefix in case other sites share this box.
# A login is four requests (three for the puzzle). A class signing in together behind one IP
# (school Wi-Fi, carrier NAT) is ~30 logins in a few seconds: 5r/s with a burst of 10 refused
# 21 of 30 in the pilot test. Each attempt still needs a solved puzzle.
limit_req_zone $binary_remote_addr zone=amozeshyar_auth:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=amozeshyar_api:10m rate=50r/s;
# Open connections per visitor: one client can't take every backend thread by opening many.
limit_conn_zone $binary_remote_addr zone=amozeshyar_conn:10m;

server {
    listen 80;
    server_name www.SITE_HOST;
    return 301 https://SITE_HOST$request_uri;
}

server {
    listen 80;
    server_name SITE_HOST;

    server_tokens off;

    # Nuxt bundles and API JSON are proxied uncompressed; nginx only gzips text/html by default.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain;
    limit_req_status 429;

    # Ordinary API bodies (images, voice, course files up to 500 MB); only video upload gets more.
    client_max_body_size 512m;
    # Request bodies are buffered by nginx (to disk past 1 MB) before Django sees them, so a slow
    # client uploading for twenty minutes holds no gunicorn thread meanwhile: the backend only
    # gets the finished body over the local socket. Needs free disk in nginx's
    # client_body_temp_path for the largest upload (2 GB for a video).
    client_body_buffer_size 1m;
    proxy_request_buffering on;

    location /api/v1/videos/upload/ {
        client_max_body_size 2g;
        limit_conn amozeshyar_conn 3;
        # Long enough for a 2 GB body at a slow connection.
        client_body_timeout 120s;
        proxy_pass http://127.0.0.1:8100;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/auth/ {
        limit_req zone=amozeshyar_auth burst=60 nodelay;
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=amozeshyar_api burst=100 nodelay;
        limit_conn amozeshyar_conn 20;
        proxy_pass http://127.0.0.1:8100;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # S3 signatures cover the Host header, so it must reach MinIO unchanged.
    # These are users' files on the site's own origin. The backend stores each with a type it
    # chose itself (anything not an image/audio/video is a forced download), and these headers
    # are the second lock: even a file stored as text/html before that fix opens as a sandboxed
    # document with no script and no access to the site. They only apply when a file is opened
    # as a page; <img>, <audio> and the video player ignore a resource's own CSP.
    # No trailing slash: the app's bucket-level calls (list, batch delete of a removed video's
    # files) go to /modaresyar-media?list-type=2 and /modaresyar-media?delete. With the slash
    # they fell through to Nuxt, which answered 301 forever, so old video files were never
    # deleted (pilot test). MinIO itself still refuses anonymous bucket access.
    location /modaresyar-media {
        client_max_body_size 2g;
        proxy_pass http://127.0.0.1:9200;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        add_header Content-Security-Policy "sandbox; default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Nuxt's image resizer (ipx + sharp/libvips, which still has open advisories): it only reads
    # the app's own images, but every new size is CPU work, so a client can't ask for hundreds
    # a second on a 2-vCPU server. Results are cached by the browser for a year.
    location /_ipx/ {
        limit_req zone=amozeshyar_api burst=40 nodelay;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django sets these on API responses itself; the Nuxt pages need them from here.
    location / {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Camera, microphone and screen sharing only for the live class (the Jitsi iframe asks
        # for them itself); "camera=()" used to switch the camera off for it too.
        add_header Permissions-Policy "camera=(self \"https://meet.jit.si\"), microphone=(self \"https://meet.jit.si\"), display-capture=(self \"https://meet.jit.si\"), geolocation=(), payment=()" always;
        # SEC-08. Scripts, connections, frames and forms only from this site (and Jitsi for the
        # live class), no plugins, no <base> hijacking, no framing by other sites. Inline scripts
        # are still allowed: Nuxt inlines its runtime config and the theme script, and the config
        # one changes with every deploy, so a hash list would break silently; a nonce needs the
        # nuxt-security module (deploy/README.md, «CSP»). Checked against every page's HTML.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://meet.jit.si; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self'; frame-src https://meet.jit.si; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
