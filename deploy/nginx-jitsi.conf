# Host nginx for the live-class subdomain, Jitsi on the same server as the site
# (deploy/jitsi/install.sh puts its web on 127.0.0.1:8200). Replace JITSI_HOST, then:
#   certbot --nginx -d JITSI_HOST
# Audio and video don't pass here: they go straight to UDP 10000 (open it in the firewall).
# The site embeds this domain's pages in its classroom page; nothing else may frame them.

map $http_upgrade $jitsi_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name JITSI_HOST;

    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Signalling: WebSocket (current clients) and BOSH (fallback). Long-lived, so no short timeouts.
    location ~ ^/(xmpp-websocket|colibri-ws/) {
        proxy_pass http://127.0.0.1:8200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $jitsi_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 900s;
        tcp_nodelay on;
    }

    location = /http-bind {
        proxy_pass http://127.0.0.1:8200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
