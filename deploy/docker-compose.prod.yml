# One instructor site on a single small VPS (2 GB RAM). Run from the repository root:
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
# deploy/.env holds the secrets (see deploy/README.md); nginx on the host terminates TLS and
# proxies to the 127.0.0.1 ports below. Memory limits keep it from starving other apps on the box.
name: amozeshyar

x-backend: &backend
  build:
    context: ..
    dockerfile: deploy/backend.Dockerfile
  image: amozeshyar-backend
  env_file: .env
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: amozeshyar
      POSTGRES_USER: amozeshyar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amozeshyar"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    mem_limit: 96m
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9200:9000"
    mem_limit: 384m
    restart: unless-stopped

  backend:
    <<: *backend
    ports:
      - "127.0.0.1:8100:8000"
    mem_limit: 448m

  worker:
    <<: *backend
    # Reuses the image the backend service builds; building it twice races on the same tag.
    build: !reset null
    # One video at a time: ffmpeg is the heaviest thing on the box.
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency", "1"]
    mem_limit: 768m

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    image: amozeshyar-frontend
    environment:
      NUXT_PUBLIC_API_BASE: ${PUBLIC_URL}/api/v1
      NUXT_PUBLIC_SITE_URL: ${PUBLIC_URL}
    ports:
      - "127.0.0.1:3300:3000"
    mem_limit: 256m
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
